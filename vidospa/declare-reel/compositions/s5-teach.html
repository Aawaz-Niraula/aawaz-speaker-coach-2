    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s5-glow", { scale: 0.96, opacity: 0.8 }, { scale: 1.07, opacity: 1, duration: 4.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#s5-grid", { y: 0 }, { y: -80, duration: 9.6, ease: "none" }, 0);
      tl.fromTo("#s5-math", { x: 16 }, { x: -16, duration: 9.6, ease: "sine.inOut" }, 0);

      const steps = ["#s5-st1", "#s5-st2", "#s5-st3", "#s5-st4"];
      const shots = ["#s5-sh1", "#s5-sh2", "#s5-sh3", "#s5-sh4", "#s5-sh5", "#s5-sh6", "#s5-sh7", "#s5-sh8", "#s5-sh9"];

      tl.set(steps, { autoAlpha: 0 }, 0);
      tl.set(shots, { autoAlpha: 0 }, 0);

      // ── Ladder builds (0.0 – 3.4) ──
      tl.fromTo("#s5-kick", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.42, ease: "power3.out" }, 0.15);
      steps.forEach((sel, i) => {
        tl.fromTo(sel, { y: 40, scale: 0.97 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.3 + i * 0.34);
      });

      // clear the ladder for the montage
      tl.to(["#s5-kick", ".ladder"], { autoAlpha: 0, y: -30, duration: 0.35, ease: "power2.in" }, 2.9);

      // ── Photo montage: one flip every 0.5s, snappier than a page turn ──
      const START = 3.3;
      const STEP = 0.5;
      shots.forEach((sel, i) => {
        const at = START + i * STEP;
        // later photos stack above earlier ones so each new page lands ON TOP
        // of the one it replaces, hiding it the way a real page turn would
        tl.set(sel, { zIndex: 10 + i }, 0);
        // each photo flips in like a turned page — fully opaque for its whole
        // entrance so it covers the outgoing one instead of dissolving through it
        tl.fromTo(
          sel,
          { autoAlpha: 1, rotationY: -46, scale: 0.94, x: 70, transformPerspective: 900 },
          { autoAlpha: 1, rotationY: 0, scale: 1, x: 0, duration: 0.36, ease: "power3.out" },
          at,
        );
        // the outgoing page is killed instantly once covered. a slow fade here
        // cross-dissolves two photos and reads as a mistake, not a page turn
        if (i < shots.length - 1) {
          tl.set(sel, { autoAlpha: 0 }, at + STEP + 0.14);
        }
      });

      // the group shot is the payoff, so it holds a beat longer than a cut but
      // never long enough to feel stranded
      const lastAt = START + (shots.length - 1) * STEP;
      tl.to("#s5-sh9", { scale: 1.03, duration: 1.5, ease: "sine.out" }, lastAt + 0.3);
      tl.to("#s5-sh9", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, lastAt + 1.8);
