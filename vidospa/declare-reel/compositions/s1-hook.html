    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ambient decoratives, slow across the whole scene
      tl.fromTo("#s1-glow", { scale: 0.94, opacity: 0.7 }, { scale: 1.06, opacity: 1, duration: 3.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#s1-grid", { y: 0 }, { y: 70, duration: 7.1, ease: "none" }, 0);
      tl.fromTo("#s1-ghost", { x: -26 }, { x: 26, duration: 7.1, ease: "sine.inOut" }, 0);
      tl.fromTo("#s1-scan", { y: 0 }, { y: 12, duration: 3.55, ease: "none", yoyo: true, repeat: 1 }, 0);

      // search bar lands first
      tl.fromTo("#s1-bar", { autoAlpha: 0, y: 40, scale: 0.96 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.15);

      // caret blinks the whole scene, finite repeat so it stays deterministic
      tl.to("#s1-caret", { autoAlpha: 0, duration: 0.42, ease: "steps(1)", yoyo: true, repeat: 13 }, 0.6);

      // Each query types character by character, holds, then clears. Timed so
      // the last one is still up as the narration lands its final line.
      const QUERIES = [
        { text: "will ai take my job?", start: 0.6, type: 1.3, hold: 0.75 },
        { text: "is ai dangerous?", start: 3.15, type: 1.15, hold: 2.5 },
      ];

      const el = document.querySelector("#s1-qt");
      QUERIES.forEach((q, qi) => {
        const chars = q.text.length;
        const o = { n: 0 };
        tl.to(o, {
          n: chars,
          duration: q.type,
          ease: "none",
          onUpdate() {
            el.textContent = q.text.slice(0, Math.round(o.n));
          },
        }, q.start);
        // clear again, except the last which stays up
        if (qi < QUERIES.length - 1) {
          const c = { n: chars };
          tl.to(c, {
            n: 0,
            duration: 0.34,
            ease: "power2.in",
            onUpdate() {
              el.textContent = q.text.slice(0, Math.round(c.n));
            },
          }, q.start + q.type + q.hold);
        }
      });

      // suggestion rows drop in under the bar, staggered against the typing
      const sugs = ["#s1-sug1", "#s1-sug2", "#s1-sug3", "#s1-sug4"];
      tl.set(sugs, { autoAlpha: 0 }, 0);
      sugs.forEach((sel, i) => {
        tl.fromTo(sel, { y: 26, scale: 0.98 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.38, ease: "power3.out" }, 1.9 + i * 0.55);
      });

      // the whole search UI recedes into the stats scene
      tl.to(".stage", { autoAlpha: 0, y: -46, duration: 0.5, ease: "power2.in" }, 6.5);
