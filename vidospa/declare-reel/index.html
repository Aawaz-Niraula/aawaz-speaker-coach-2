<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DECLARE, AI literacy campaign reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #05100a;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      [data-composition-id="root"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="67.8"
    >
      <!-- Visual scenes (track 1, sequential). Each slot is slightly longer than
           its narration clip so the voice never spills into the next scene. -->
      <div
        id="el-s1"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="7.1"
        data-track-index="1"
      ></div>

      <div
        id="el-s2"
        data-composition-id="s2-stats"
        data-composition-src="compositions/s2-stats.html"
        data-start="7.1"
        data-duration="14.5"
        data-track-index="1"
      ></div>

      <div
        id="el-s3"
        data-composition-id="s3-nepal"
        data-composition-src="compositions/s3-nepal.html"
        data-start="21.6"
        data-duration="12.4"
        data-track-index="1"
      ></div>

      <div
        id="el-s4"
        data-composition-id="s4-logo"
        data-composition-src="compositions/s4-logo.html"
        data-start="34.0"
        data-duration="5.6"
        data-track-index="1"
      ></div>

      <div
        id="el-s5"
        data-composition-id="s5-teach"
        data-composition-src="compositions/s5-teach.html"
        data-start="39.6"
        data-duration="9.6"
        data-track-index="1"
      ></div>

      <div
        id="el-s6"
        data-composition-id="s6-proof"
        data-composition-src="compositions/s6-proof.html"
        data-start="49.2"
        data-duration="8.1"
        data-track-index="1"
      ></div>

      <div
        id="el-s7"
        data-composition-id="s7-cta"
        data-composition-src="compositions/s7-cta.html"
        data-start="57.3"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <!-- Music bed (track 9) -->
      <audio
        id="bgm"
        src="assets/audio/bgm-bed.wav"
        data-start="0"
        data-duration="67.8"
        data-track-index="9"
        data-volume="0.30"
      ></audio>

      <!-- Narration (track 10) -->
      <audio id="vo1" src="assets/audio/vo-s1.mp3" data-start="0.3" data-duration="6.4" data-track-index="10" data-volume="1"></audio>
      <audio id="vo2" src="assets/audio/vo-s2.mp3" data-start="7.3" data-duration="13.76" data-track-index="10" data-volume="1"></audio>
      <audio id="vo3" src="assets/audio/vo-s3.mp3" data-start="21.8" data-duration="11.68" data-track-index="10" data-volume="1"></audio>
      <audio id="vo4" src="assets/audio/vo-s4.mp3" data-start="34.2" data-duration="4.8" data-track-index="10" data-volume="1"></audio>
      <audio id="vo5" src="assets/audio/vo-s5.mp3" data-start="39.8" data-duration="8.88" data-track-index="10" data-volume="1"></audio>
      <audio id="vo6" src="assets/audio/vo-s6.mp3" data-start="49.4" data-duration="7.44" data-track-index="10" data-volume="1"></audio>
      <audio id="vo7" src="assets/audio/vo-s7.mp3" data-start="57.5" data-duration="9.76" data-track-index="10" data-volume="1"></audio>

      <!-- Typing SFX under the Google search queries -->
      <audio id="sfx-t1" src="assets/audio/typing.mp3" data-start="0.60" data-duration="1.3" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-t2" src="assets/audio/typing.mp3" data-start="3.15" data-duration="1.15" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-k1" src="assets/audio/key.mp3" data-start="1.90" data-duration="0.4" data-track-index="13" data-volume="0.34"></audio>
      <audio id="sfx-k2" src="assets/audio/key.mp3" data-start="2.45" data-duration="0.4" data-track-index="14" data-volume="0.34"></audio>
      <audio id="sfx-k3" src="assets/audio/key.mp3" data-start="3.00" data-duration="0.4" data-track-index="13" data-volume="0.34"></audio>
      <audio id="sfx-k4" src="assets/audio/key.mp3" data-start="3.55" data-duration="0.4" data-track-index="14" data-volume="0.34"></audio>

      <!-- stat slams -->
      <audio id="sfx-imp1" src="assets/audio/impact.mp3" data-start="8.5" data-duration="2.1" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-imp2" src="assets/audio/impact.mp3" data-start="12.1" data-duration="2.1" data-track-index="12" data-volume="0.42"></audio>
      <audio id="sfx-imp3" src="assets/audio/impact.mp3" data-start="16.5" data-duration="2.1" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-imp4" src="assets/audio/impact.mp3" data-start="22.6" data-duration="2.1" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-imp5" src="assets/audio/impact.mp3" data-start="25.2" data-duration="2.1" data-track-index="11" data-volume="0.4"></audio>

      <!-- riser into the logo reveal, then the reveal whoosh -->
      <audio id="sfx-riser" src="assets/audio/riser.mp3" data-start="30.3" data-duration="3.7" data-track-index="12" data-volume="0.32"></audio>
      <audio id="sfx-reveal" src="assets/audio/reveal.mp3" data-start="34.0" data-duration="5.5" data-track-index="11" data-volume="0.5"></audio>

      <!-- page flip per photo, 9 cuts 0.5s apart from 45.2s -->
      <audio id="sfx-f1" src="assets/audio/page-flip.mp3" data-start="42.90" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f2" src="assets/audio/page-flip.mp3" data-start="43.40" data-duration="0.5" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-f3" src="assets/audio/page-flip.mp3" data-start="43.90" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f4" src="assets/audio/page-flip.mp3" data-start="44.40" data-duration="0.5" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-f5" src="assets/audio/page-flip.mp3" data-start="44.90" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f6" src="assets/audio/page-flip.mp3" data-start="45.40" data-duration="0.5" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-f7" src="assets/audio/page-flip.mp3" data-start="45.90" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-f8" src="assets/audio/page-flip.mp3" data-start="46.40" data-duration="0.5" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-f9" src="assets/audio/page-flip.mp3" data-start="46.90" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>

      <!-- counter slams -->
      <audio id="sfx-imp6" src="assets/audio/impact.mp3" data-start="49.5" data-duration="2.1" data-track-index="12" data-volume="0.42"></audio>
      <audio id="sfx-imp7" src="assets/audio/impact.mp3" data-start="51.4" data-duration="2.1" data-track-index="11" data-volume="0.42"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const root = gsap.timeline({ paused: true });

      // Music rides up in the gaps and ducks under the voice. The runtime reads
      // these volume keyframes and applies them identically in preview + render.
      root.to("#bgm", { volume: 0.42, duration: 0.4 }, 0); // audible from frame one
      root.to("#bgm", { volume: 0.26, duration: 0.8 }, 7.1); // stats, voice dense
      root.to("#bgm", { volume: 0.34, duration: 1.0 }, 31.5); // let the build swell
      root.to("#bgm", { volume: 0.44, duration: 0.6 }, 34.0); // the drop, on the logo
      root.to("#bgm", { volume: 0.25, duration: 0.8 }, 39.6); // montage narration
      root.to("#bgm", { volume: 0.40, duration: 0.8 }, 47.0); // montage tail, no VO
      root.to("#bgm", { volume: 0.25, duration: 0.6 }, 49.2); // proof beat
      root.to("#bgm", { volume: 0.44, duration: 1.2 }, 57.8); // end card

      window.__timelines["root"] = root;
    </script>
  </body>
</html>
